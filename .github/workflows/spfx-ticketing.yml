name: SPFx Ticketing Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'packages/spfx-ticketing/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/spfx-ticketing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
          cache-dependency-path: packages/spfx-ticketing/package.json
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Bundle (ship)
        run: npm run bundle -- --ship
      - name: Package solution
        run: npm run package-solution -- --ship
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: spfx-ticketing-sppkg
          path: packages/spfx-ticketing/sharepoint/solution/*.sppkg
